name: CI/CD Completo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: 30

jobs:
  lint:
    name: Verificar estilo de código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Instalar herramientas
        run: |
          pip install flake8 black isort
      
      - name: Verificar importaciones (isort)
        run: isort --check-only .
      
      - name: Verificar formato (black)
        run: black --check .
      
      - name: Verificar estilo (flake8)
        run: flake8 . --count --max-complexity=10 --statistics

  test:
    name:  Ejecutar pruebas
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Ejecutar pruebas
        run: pytest -v --tb=short
      
      - name: Ejecutar pruebas con cobertura
        run: pytest --cov=. --cov-report=xml --cov-report=term
      
      - name: Subir cobertura
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  security:
    name:  Verificar seguridad
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Instalar herramientas de seguridad
        run: pip install bandit safety
      
      - name: Verificar vulnerabilidades (safety)
        run: safety check -r requirements.txt
      
      - name: Verificar código (bandit)
        run: bandit -r . -ll

  deploy:
    name:  Desplegar a producción
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && success()
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      
      - name: Desplegar
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo " Iniciando despliegue..."
          curl -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"serviceId": "'"$RENDER_SERVICE_ID"'"}' \
            https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys
          echo " Despliegue iniciado"

  notify:
    name:  Notificar resultado
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
      - name: Notificar éxito
        if: success()
        run: echo " ¡Despliegue exitoso!"
      
      - name: Notificar fallo
        if: failure()
        run: echo " El despliegue falló. Revisa los logs."